<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Search Console ownership proof for the URL-prefix property.
         Inert markup — not a third-party script — so it stays within the
         own-origin rule. Leave it in place after Verify; Google re-checks
         and drops the property if the tag disappears. See docs/SITE.md. -->
    <meta
      name="google-site-verification"
      content="8KEB_ImW46lZ1uEgVTf1tSrpM0-7fUmtRUIeJD9inq8"
    />

    <!-- The same thing for Yandex, which is where the Russian-language queries
         the `/ru/` entry exists for mostly happen. Inert markup like the tag
         above, so it stays inside the own-origin rule; kept in place after
         verifying, because Yandex re-checks it and drops the property when the
         proof disappears. One property covers both entries. `YANDEX_VERIFICATION`
         in `src/header/site.ts` is where this value lives. -->
    <meta name="yandex-verification" content="fb2c212fd42a88fb" />

    <title>Diablo II Runeword Tracker (D2R)</title>

    <!-- What a search result gets to say about the page. English, because this
         is the English entry: `ru/index.html` is the same application behind a
         Russian document head, and the hreflang trio below is how a crawler
         learns the two are one page in two languages.

         "D2R" appears in the title and description on purpose — it is the
         abbreviation players actually type into a search box, and it occurs
         nowhere in the page's own prose. "Chronicle" is here for the same
         reason and is the more valuable of the two: it names the in-game log
         this tracker exists to fill, it is what a player searching for exactly
         this tool would type, and until it was added it appeared in no static
         text at all — only in strings React renders, which a crawler reaches
         late and weights lightly.

         Kept to one sentence about what the tracker does rather than a list of
         runeword names — the names are in the table, and a description stuffed
         with them describes nothing. The Open Graph pair repeats the title and
         this same sentence deliberately: two wordings of one page are two things
         to keep in step, and the second one is the one that rots.

         The canonical href, the hreflang pair, the sitemap's <loc> entries and
         the Sitemap: line in robots.txt are the same absolute URLs, pinned in
         `src/header/site.ts` and checked against these files by
         `scripts/crawl-files.test.ts`. -->
    <meta
      name="description"
      content="Track which Diablo II: Resurrected (D2R) runewords you have crafted for the Chronicle, and which runes and bases the rest need. The full list, in your browser."
    />
    <link
      rel="canonical"
      href="https://jekman87.github.io/diablo2-runeword-tracker/"
    />
    <link
      rel="alternate"
      hreflang="en"
      href="https://jekman87.github.io/diablo2-runeword-tracker/"
    />
    <link
      rel="alternate"
      hreflang="ru"
      href="https://jekman87.github.io/diablo2-runeword-tracker/ru/"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://jekman87.github.io/diablo2-runeword-tracker/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Diablo II Runeword Tracker (D2R)" />
    <meta
      property="og:description"
      content="Track which Diablo II: Resurrected (D2R) runewords you have crafted for the Chronicle, and which runes and bases the rest need. The full list, in your browser."
    />
    <meta
      property="og:url"
      content="https://jekman87.github.io/diablo2-runeword-tracker/"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <!-- The social card. A committed file in `public/` rather than a hashed
         asset in `src/`, because a crawler reads this URL out of the static
         HTML and Vite does not rewrite meta content. 1200×630 is the size the
         large-card renderers crop least. -->
    <meta
      property="og:image"
      content="https://jekman87.github.io/diablo2-runeword-tracker/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Inert structured data, not a script that runs — within the page's
         no-third-party rule. One block, saying what the application is and
         that it speaks two languages. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Diablo II Runeword Tracker",
        "url": "https://jekman87.github.io/diablo2-runeword-tracker/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "inLanguage": ["en", "ru"]
      }
    </script>

    <!-- The Jah rune, cropped from the shared sprite at its native 40×40 cell
         rather than redrawn or scaled up. Same rule the icons in the table
         follow: the artwork is 40px and does not survive being enlarged, so the
         browser downscales it to whatever the tab wants instead.

         Referenced from `src/` rather than dropped in `public/` so Vite
         fingerprints it and prefixes the GitHub Pages sub-path, like every other
         image here. A `public/` file would be served unhashed from the domain
         root and 404 on the deployed site. -->
    <link rel="icon" type="image/png" href="./src/assets/images/jah-rune.png" />

    <!-- The display face, fetched as early as the document itself.

         Without this the browser cannot know the font exists until it has
         downloaded and parsed the stylesheet, which is one round trip too late:
         the heading paints in the fallback serif and then re-lays-out when
         Bellefair arrives, and Cambria and Bellefair are different enough widths
         that the title visibly jumps. Preloading starts the 16.5 kB request in
         parallel with the CSS instead, and `font-display: optional` in
         `src/index.css` is the other half — see the note there for why the two are
         one decision.

         `crossorigin` is not optional even though the file is same-origin: font
         requests are made in CORS mode, and a preload without it is a second,
         unused download rather than a warm cache entry.

         Referenced from `src/` for the same reason as the icon above, so Vite
         fingerprints it and it resolves to the one hashed file the stylesheet
         also points at. -->
    <link
      rel="preload"
      href="./src/assets/fonts/bellefair-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Corrected when the entries became prerendered. This used to say the page
         "needs JavaScript to run", which was true while `#root` above was empty
         and is not any more: the build renders the whole list into it, so a
         reader without scripting can read every runeword, its runes, its bases
         and its level. What they cannot do is tick one, search, sort, or carry
         progress to another browser — so that is what this says instead.

         Still deliberately terse and unstyled. The stylesheet is a real `<link>`
         in the built document, so the list above it is styled; this paragraph is
         a statement about what is missing, not a fallback for a failed load.

         The help panel is the fuller version of this and needs scripting to
         open, which is exactly why one sentence of it lives out here. -->
    <noscript>
      <p>
        Diablo II Runeword Tracker (D2R) — the list below is complete and
        readable without JavaScript: every runeword, its runes in order, the
        bases it can go in and the level it needs. Marking a runeword as crafted
        for the Chronicle, searching, sorting and carrying your progress between
        browsers all need JavaScript.
      </p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Cloudflare Web Analytics. Cloudflare's own snippet, unrewritten: a
         `type="module"` script is deferred by definition, so it cannot delay
         the tracker, and an equivalent they do not test buys nothing. Cookieless
         and identifier-free, which is why the page carries no consent dialog.
         The token is `ANALYTICS_TOKEN` in `src/header/site.ts`, and
         `scripts/crawl-files.test.ts` holds this copy against it — see there for
         why it is public rather than secret. Ad blockers commonly block this
         host, so the numbers are a trend, not a census. -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "1f854178248c4131a1f8744b9e4121d7"}'
    ></script>
  </body>
</html>
